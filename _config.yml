# url/baseurl은 GitHub Pages가 레포 이름에 맞춰 자동으로 채운다.
title: KTB AX
description: 카카오테크 부트캠프 4기 AX 동아리가 만든 도구
lang: ko
timezone: Asia/Seoul
markdown: kramdown

collections:
  projects:
    output: true
    permalink: /plugins/:name/
  members:
    output: true
    permalink: /members/:name/

defaults:
  - scope: { type: projects }
    values: { layout: project }
  - scope: { type: members }
    values: { layout: member }

exclude: [README.md, templates]
