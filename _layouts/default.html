<!doctype html>
<html lang="{{ site.lang }}" data-base="{{ site.baseurl }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  {% if page.thumbnail %}<meta property="og:image" content="{{ page.thumbnail | absolute_url }}">{% endif %}
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/app.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">KTB AX</a>
      <nav class="nav-links" aria-label="주요 메뉴">
        {% assign path = page.url %}
        <a href="{{ '/' | relative_url }}"{% if path == '/' or path contains '/plugins/' %} aria-current="page"{% endif %}>프로젝트</a>
        <a href="{{ '/members/' | relative_url }}"{% if path contains '/members/' %} aria-current="page"{% endif %}>동아리원</a>
      </nav>
      <form class="search" action="{{ '/' | relative_url }}" role="search">
        <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M11.5 10.1 15 13.6l-1.4 1.4-3.5-3.5a6 6 0 1 1 1.4-1.4ZM6.5 11a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"/></svg>
        <label class="sr-only" for="q">프로젝트 검색</label>
        <input id="q" name="q" type="search" placeholder="프로젝트 검색" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <button class="theme" type="button" aria-label="다크 모드" aria-pressed="false">
        <svg class="i-sun" aria-hidden="true" viewBox="0 0 16 16"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9ZM7.25 0h1.5v2h-1.5V0Zm0 14h1.5v2h-1.5v-2ZM0 7.25h2v1.5H0v-1.5Zm14 0h2v1.5h-2v-1.5ZM2.1 3.16 3.16 2.1l1.42 1.42-1.06 1.06L2.1 3.16Zm9.32 9.32 1.06-1.06 1.42 1.42-1.06 1.06-1.42-1.42ZM12.84 2.1l1.06 1.06-1.42 1.42-1.06-1.06 1.42-1.42ZM3.52 11.42l1.06 1.06-1.42 1.42-1.06-1.06 1.42-1.42Z"/></svg>
        <svg class="i-moon" aria-hidden="true" viewBox="0 0 16 16"><path d="M6.2 1.1A6.5 6.5 0 1 0 14.9 9.8 5.5 5.5 0 0 1 6.2 1.1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <p class="wrap">카카오테크 부트캠프 4기 AX 동아리</p>
  </footer>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
