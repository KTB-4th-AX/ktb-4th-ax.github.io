<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
  <main>
    {% if page.date %}
      <h1>{{ page.title }}</h1>
      <p class="meta">{{ page.date | date: "%Y-%m-%d" }} · {{ page.category }}</p>
      {% if page.video %}<video controls preload="metadata" src="{{ page.video | relative_url }}"></video>{% endif %}
    {% endif %}
    {{ content }}
  </main>
</body>
</html>
