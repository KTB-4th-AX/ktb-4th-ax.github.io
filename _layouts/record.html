---
layout: default
---
<article class="wrap record">
  <nav class="crumbs" aria-label="현재 위치"><a href="{{ '/records/' | relative_url }}">활동 기록</a><span aria-hidden="true">›</span><span aria-current="page">{{ page.title }}</span></nav>
  <header>
    <time class="muted" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%Y년 %-m월 %-d일' }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  {%- if page.video -%}
  <div class="stage"><video controls playsinline preload="metadata" src="{{ page.video | relative_url }}"></video></div>
  {%- endif -%}
  <div class="prose">{{ content }}</div>
</article>
